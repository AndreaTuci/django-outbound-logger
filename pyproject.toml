[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-outbound-logger"
version = "0.4.0"
description = "Log outgoing email and HTTP requests to the database, with their outcome and a retry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrea Tuci", email = "tuci.registrazioni@gmail.com" }]
keywords = ["django", "email", "logging", "smtp", "http", "retry", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
http = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/AndreaTuci/django-outbound-logger"
Repository = "https://github.com/AndreaTuci/django-outbound-logger"
Issues = "https://github.com/AndreaTuci/django-outbound-logger/issues"

[tool.hatch.build.targets.wheel]
packages = ["outbound_logger"]

[tool.hatch.build.targets.sdist]
include = [
    "outbound_logger",
    "example",
    "manage.py",
    "tests",
    "runtests.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.mypy]
python_version = "3.10"
files = ["outbound_logger"]
exclude = "migrations"
ignore_missing_imports = true
